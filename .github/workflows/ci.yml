name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # GitHub-hosted runners have no GPU and no model file. Every check
      # below runs on CPU against the test suite's fakes; nothing here
      # starts the native worker or loads weights.
      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}
      - name: ruff format
        run: uv run --no-sync ruff format --check .
      - name: ruff check
        run: uv run --no-sync ruff check .
      - name: mypy
        run: uv run --no-sync mypy --strict --explicit-package-bases riderless scripts
      - name: pytest
        run: uv run --no-sync pytest

  native:
    name: native helper test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # worker-utils-test.cpp includes only worker-utils.h and the C++
      # standard library, so it builds and runs without llama.cpp, without
      # a model, and without a GPU. The CMake project in
      # riderless/api/native also configures the full worker target and
      # therefore needs LLAMA_SOURCE and LLAMA_BUILD, so CI compiles the
      # helper test directly instead of going through cmake and ctest.
      - name: Build worker-utils test
        run: |
          mkdir -p build
          c++ -std=c++17 -Wall -Wextra -Werror -O2 \
            -o build/riderless-worker-utils-test \
            riderless/api/native/worker-utils-test.cpp
      - name: Run worker-utils test
        run: ./build/riderless-worker-utils-test
