name: Bug report
description: Report unexpected behavior with a reproducible example.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Report suspected vulnerabilities through
        [private vulnerability reporting](https://github.com/potto007/riderless/security/advisories/new),
        not this public form. See the [security policy](https://github.com/potto007/riderless/security/policy).

        Search existing issues first. Remove API keys, machine-specific
        absolute paths, and personal data from payloads and logs before
        posting them, and do not include measurements of any third-party
        hosted API.
        Participation follows the [Code of Conduct](https://github.com/potto007/riderless/blob/main/.github/CODE_OF_CONDUCT.md).
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release tag or commit are you running?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your OS, Python version, how you installed the project, the llama.cpp revision and model file if the native worker is involved, and whether you ran on CPU or with `--gpu`.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest request payload and commands that reproduce the problem. Use made-up content in the state and the questions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the HTTP status, the error body, or the exit code.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove API keys, absolute paths that identify your machine, and any private content from the state you sent.
      render: text
