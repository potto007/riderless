[project]
name = "unridden"
version = "0.4.0"
description = "A local, non-generative decision API: typed questions answered from final-position logits, with zero generated tokens."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

# The same set as the `dev` extra above, so `uv sync --dev` and
# `pip install -e ".[dev]"` both give a complete check environment.
[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
unridden-api = "unridden.api.cli:main"
unridden-semif = "unridden.api.semif:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unridden"]
# The tests import the harness under scripts/, which is not packaged, so they
# would be unimportable in an installed distribution.
exclude = ["unridden/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["unridden/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
warn_unreachable = true

# so1 (open-alternative-jev) ships no type information; it and transformers are
# only installed for the competitor benchmark, and CI installs neither.
[[tool.mypy.overrides]]
module = ["so1", "so1.*", "transformers", "transformers.*"]
ignore_missing_imports = true
