<rect x="332.6" y="106" width="10" height="26" rx="2" class="early"/>
<rect x="343.9" y="106" width="10" height="26" rx="2" class="early"/>
<rect x="355.20000000000005" y="106" width="10" height="26" rx="2" class="early"/>
<rect x="366.5" y="106" width="10" height="26" rx="2" class="early"/>
<rect x="377.8" y="106" width="10" height="26" rx="2" class="early"/>
<rect x="389.1" y="106" width="10" height="26" rx="2" class="early"/>
<rect x="400.4" y="106" width="10" height="26" rx="2" class="off"/>
