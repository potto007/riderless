<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="title desc">
<title id="title">Early-exit cascade from the earlier proof of concept</title>
<desc id="desc">Not part of riderless. A prompt runs through Gemma blocks 1 to 18 only; a trained linear head turns the block-18 residual into calibrated probabilities over three banking intents. If the top probability is at least 0.71 the early answer is accepted (112 of 120 cases, median 16.92 ms). Otherwise a separate full context prefills the same prompt through all 30 blocks and reads the A, B, C label logits (8 of 120 cases, median 44.58 ms). Median latency fell from 27.98 to 17.01 ms while p95 rose from 32.37 to 43.60 ms.</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 11px; }
  .title { font-size: 16px; font-weight: 600; }
  .b { font-weight: 600; font-size: 12px; }
  .sub, .note { fill: #59636e; font-size: 10.5px; }
  .tag, .tick { fill: #59636e; font-size: 9.5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; }
  .chip { fill: #ffffff; font-size: 9.5px; font-weight: 600; }
  .good { fill: #1a7f37; }
  .warn { fill: #9a6700; }
  .bg { fill: #ffffff; }
  .panel { fill: #f6f8fa; stroke: #d1d9e0; }
  .box { fill: #ffffff; stroke: #d1d9e0; }
  .early { fill: #0969da; }
  .full { fill: #9a6700; }
  .off { fill: none; stroke: #afb8c1; stroke-dasharray: 2 2; }
  .gate { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
  .accept { fill: #dafbe1; stroke: #1a7f37; }
  .fallback { fill: #fff8c5; stroke: #9a6700; }
  .rule { stroke: #d1d9e0; }
  .arrow { stroke: #818b98; stroke-width: 1.5; fill: none; }
  #ah path { fill: #818b98; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .sub, .note, .tag, .tick { fill: #9198a1; }
    .chip { fill: #0d1117; }
    .good { fill: #3fb950; }
    .warn { fill: #d29922; }
    .bg { fill: #0d1117; }
    .panel { fill: #151b23; stroke: #3d444d; }
    .box, .gate { fill: #0d1117; stroke: #3d444d; }
    .gate { stroke: #9198a1; }
    .early { fill: #4493f8; }
    .full { fill: #d29922; }
    .off { stroke: #656c76; }
    .accept { fill: #0f2a19; stroke: #3fb950; }
    .fallback { fill: #2e2408; stroke: #d29922; }
    .rule { stroke: #3d444d; }
    .arrow { stroke: #656c76; }
    #ah path { fill: #656c76; }
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" class="bg"/>
<text x="20" y="30" class="title">Early-exit cascade</text>
<text x="172" y="30" class="sub">earlier proof of concept, not part of riderless</text>
<text x="20" y="50" class="sub">One fixed three-intent banking task on the same Gemma 4 26B-A4B GGUF. The riderless worker always reads full depth.</text>
<rect x="20" y="108" width="140" height="90" rx="6" class="box"/>
<text x="32" y="130" class="b">Prompt</text>
<text x="32" y="150" class="note">banking message,</text>
<text x="32" y="165" class="note">intents A, B, C</text>
<text x="32" y="180" class="note">context cleared</text>
<line x1="162" y1="153" x2="183" y2="153" class="arrow" marker-end="url(#ah)"/>
<rect x="185" y="72" width="360" height="160" rx="10" class="panel"/>
<text x="197" y="94" class="b">Early context: blocks 1 to 18 only</text>
<rect x="197.0" y="106" width="10" height="26" rx="2" class="early"/>
